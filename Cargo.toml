[workspace]
members = [".", "crates/domain"]
resolver = "3"

[package]
name = "rust-axum-react-starter-kit"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
license = "MIT"
publish = false

[dependencies]
anyhow = "1.0.100"
apalis = { version = "0.7.4", features = ["limit", "tracing"] }
apalis-redis = { version = "0.7.4", features = ["tokio"] }
argon2 = "0.5.3"
async-graphql = { version = "7.0.17", features = ["chrono", "uuid"] }
async-graphql-axum = "7.0.17"
axum = { version = "0.8.7", features = ["macros"] }
chrono = { version = "0.4.42", features = ["serde"] }
clap = { version = "4.5.53", features = ["derive", "env"] }
dotenvy = "0.15.7"
futures-util = "0.3.31"
http = "1.4.0"
redis = { version = "0.32.7", features = ["tokio-comp", "connection-manager"] }
reqwest = { version = "0.12.24", default-features = false, features = ["json", "rustls-tls"] }
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
sqlx = { version = "0.8.6", default-features = false, features = ["runtime-tokio-rustls", "postgres", "chrono", "uuid", "migrate"] }
tokio = { version = "1.48.0", features = ["fs", "macros", "net", "rt-multi-thread", "sync", "time"] }
tokio-stream = { version = "0.1.17", features = ["sync"] }
tower-http = { version = "0.6.6", features = ["cors", "request-id", "set-header", "trace", "util"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter", "json"] }
uptime-domain = { path = "crates/domain", version = "0.1.0" }
url = "2.5.8"
uuid = { version = "1.18.1", features = ["serde", "v4"] }

[profile.dev]
debug = 0
incremental = true

[profile.release]
codegen-units = 1
lto = "thin"
strip = "symbols"
