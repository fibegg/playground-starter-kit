x-fibe.gg:
  variables:
    app_secret:
      name: App secret
      required: false
      random: true
    pgpassword:
      name: Postgres password
      required: false
      random: true
    subdomain:
      name: Subdomain
      required: false
      default: rust-starter
      validation: "/^(@|[a-z0-9]+(-[a-z0-9]+)*)$/"
      path: services.frontend.labels.fibe.gg/subdomain
    branch:
      name: Git branch
      required: false
      default: main

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "1m"
    max-file: "2"

services:
  postgres:
    image: postgres:18.3-alpine
    mem_limit: 160m
    cpus: "0.25"
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    command: postgres -c config_file=/etc/postgresql/postgresql.conf
    configs:
      - source: postgres_config
        target: /etc/postgresql/postgresql.conf
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: $$var__pgpassword
      POSTGRES_DB: uptime_console
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d uptime_console"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:8.4-alpine
    command: redis-server --maxmemory 64mb --maxmemory-policy allkeys-lru --save "" --appendonly no --tcp-keepalive 60 --hz 1
    mem_limit: 96m
    cpus: "0.10"
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  setup:
    build:
      context: .
      dockerfile: Dockerfile.dev
    mem_limit: ${SETUP_MEM_LIMIT:-1024m}
    cpus: ${SETUP_CPUS:-1.00}
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "cargo run -- setup"
    environment:
      APP_ENV: development
      APP_SECRET: $$var__app_secret
      DATABASE_URL: postgres://postgres:$$var__pgpassword@postgres:5432/uptime_console
      REDIS_URL: redis://redis:6379/0
      PUBLIC_DEMO_PASSWORD: password
      DB_MAX_CONNECTIONS: "2"
      DB_MIN_CONNECTIONS: "0"
      CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
      CARGO_INCREMENTAL: "1"
      CARGO_TARGET_DIR: /workspace/target
      CARGO_TERM_COLOR: always
    volumes:
      - .:/workspace:cached
      - cargo_cache:/usr/local/cargo/registry
      - cargo_git_cache:/usr/local/cargo/git
      - target_cache:/workspace/target
    labels:
      fibe.gg/repo_url: https://github.com/fibegg/playground-starter-kit
      fibe.gg/dockerfile: Dockerfile.dev
      fibe.gg/branch: $$var__branch
      fibe.gg/source_mount: /workspace
      fibe.gg/env_file: env.example

  web:
    build:
      context: .
      dockerfile: Dockerfile.dev
    mem_limit: ${WEB_MEM_LIMIT:-1024m}
    cpus: ${WEB_CPUS:-1.00}
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "cargo watch --delay 0.1 --watch Cargo.toml --watch Cargo.lock --watch rust-toolchain.toml --watch src --watch crates --watch migrations -x 'run -- serve'"
    environment:
      APP_ENV: development
      APP_PORT: ${APP_PORT:-3000}
      APP_SECRET: $$var__app_secret
      APP_ALLOWED_HOSTS: ${APP_ALLOWED_HOSTS:-*}
      APP_PUBLIC_ORIGIN: ${APP_PUBLIC_ORIGIN:-}
      APP_TRUST_PROXY_HEADERS: ${APP_TRUST_PROXY_HEADERS:-true}
      APP_FORCE_HTTPS: ${APP_FORCE_HTTPS:-false}
      APP_ASSUME_HTTPS: ${APP_ASSUME_HTTPS:-false}
      APP_HSTS: ${APP_HSTS:-false}
      APP_FRAME_ANCESTORS: ${APP_FRAME_ANCESTORS:-}
      APP_X_FRAME_OPTIONS: ${APP_X_FRAME_OPTIONS:-}
      APP_CSP_MODE: ${APP_CSP_MODE:-off}
      APP_CSP_CONNECT_SRC: ${APP_CSP_CONNECT_SRC:-}
      APP_CORS_ALLOWED_ORIGINS: ${APP_CORS_ALLOWED_ORIGINS:-*}
      APP_COOKIE_SECURE: ${APP_COOKIE_SECURE:-auto}
      APP_COOKIE_SAMESITE: ${APP_COOKIE_SAMESITE:-lax}
      APP_ALLOW_PRIVATE_MONITOR_URLS: ${APP_ALLOW_PRIVATE_MONITOR_URLS:-false}
      DATABASE_URL: postgres://postgres:$$var__pgpassword@postgres:5432/uptime_console
      REDIS_URL: redis://redis:6379/0
      DB_MAX_CONNECTIONS: ${DB_MAX_CONNECTIONS:-5}
      DB_MIN_CONNECTIONS: ${DB_MIN_CONNECTIONS:-0}
      DB_ACQUIRE_TIMEOUT_MS: ${DB_ACQUIRE_TIMEOUT_MS:-1500}
      CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
      CARGO_INCREMENTAL: "1"
      CARGO_TARGET_DIR: /workspace/target
      CARGO_TERM_COLOR: always
      RUST_LOG: ${RUST_LOG:-info,tower_http=info}
    volumes:
      - .:/workspace:cached
      - cargo_cache:/usr/local/cargo/registry
      - cargo_git_cache:/usr/local/cargo/git
      - target_cache:/workspace/target
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:3000/up').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
    labels:
      fibe.gg/repo_url: https://github.com/fibegg/playground-starter-kit
      fibe.gg/dockerfile: Dockerfile.dev
      fibe.gg/branch: $$var__branch
      fibe.gg/source_mount: /workspace
      fibe.gg/env_file: env.example

  worker:
    build:
      context: .
      dockerfile: Dockerfile.dev
    mem_limit: ${WORKER_MEM_LIMIT:-768m}
    cpus: ${WORKER_CPUS:-0.75}
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      setup:
        condition: service_completed_successfully
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: sh -c "cargo watch --delay 0.8 --watch Cargo.toml --watch Cargo.lock --watch rust-toolchain.toml --watch src --watch crates --watch migrations -x 'run -- worker'"
    environment:
      APP_ENV: development
      APP_SECRET: $$var__app_secret
      APP_ALLOW_PRIVATE_MONITOR_URLS: ${APP_ALLOW_PRIVATE_MONITOR_URLS:-false}
      DATABASE_URL: postgres://postgres:$$var__pgpassword@postgres:5432/uptime_console
      REDIS_URL: redis://redis:6379/0
      DB_MAX_CONNECTIONS: ${WORKER_DB_MAX_CONNECTIONS:-3}
      DB_MIN_CONNECTIONS: ${DB_MIN_CONNECTIONS:-0}
      DB_ACQUIRE_TIMEOUT_MS: ${DB_ACQUIRE_TIMEOUT_MS:-1500}
      CARGO_BUILD_JOBS: ${CARGO_BUILD_JOBS:-1}
      CARGO_INCREMENTAL: "1"
      CARGO_TARGET_DIR: /workspace/target
      CARGO_TERM_COLOR: always
      RUST_LOG: ${RUST_LOG:-info}
    volumes:
      - .:/workspace:cached
      - cargo_cache:/usr/local/cargo/registry
      - cargo_git_cache:/usr/local/cargo/git
      - target_cache:/workspace/target
    labels:
      fibe.gg/repo_url: https://github.com/fibegg/playground-starter-kit
      fibe.gg/dockerfile: Dockerfile.dev
      fibe.gg/branch: $$var__branch
      fibe.gg/source_mount: /workspace
      fibe.gg/env_file: env.example

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.dev
    mem_limit: ${FRONTEND_MEM_LIMIT:-384m}
    cpus: ${FRONTEND_CPUS:-0.50}
    init: true
    logging: *default-logging
    security_opt:
      - no-new-privileges:true
    depends_on:
      web:
        condition: service_started
    command: sh -c "if [ ! -x frontend/node_modules/.bin/vite ] || [ frontend/package-lock.json -nt frontend/node_modules/.package-lock.json ]; then npm --prefix frontend ci --prefer-offline --no-audit --no-fund; fi; npm --prefix frontend run dev"
    environment:
      VITE_API_ORIGIN: ${VITE_API_ORIGIN:-http://web:3000}
      VITE_ALLOWED_HOSTS: ${VITE_ALLOWED_HOSTS:-true}
      VITE_USE_POLLING: ${VITE_USE_POLLING:-false}
      NPM_CONFIG_AUDIT: "false"
      NPM_CONFIG_FUND: "false"
    volumes:
      - .:/workspace:cached
      - frontend_node_modules:/workspace/frontend/node_modules
    ports:
      - "5173:5173"
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://127.0.0.1:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 20s
    labels:
      fibe.gg/repo_url: https://github.com/fibegg/playground-starter-kit
      fibe.gg/expose: external:5173
      fibe.gg/dockerfile: Dockerfile.dev
      fibe.gg/branch: $$var__branch
      fibe.gg/source_mount: /workspace
      fibe.gg/env_file: env.example
      fibe.gg/subdomain: rust-starter
      fibe.gg/zerodowntime: "false"

volumes:
  postgres_data:
  cargo_cache:
  cargo_git_cache:
  target_cache:
  frontend_node_modules:

configs:
  postgres_config:
    content: |
      listen_addresses = '*'
      max_connections = 20
      shared_buffers = 32MB
      effective_cache_size = 128MB
      work_mem = 1MB
      maintenance_work_mem = 16MB
      wal_buffers = 1MB
      min_wal_size = 32MB
      max_wal_size = 128MB
      max_worker_processes = 2
      max_parallel_workers = 1
      max_parallel_workers_per_gather = 0
      max_parallel_maintenance_workers = 1
      jit = off
      fsync = on
      synchronous_commit = on
